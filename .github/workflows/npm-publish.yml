name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Create Release
    types:
      - completed

jobs:
  publish-npm:
    # npm refuses a provenance attestation from a self-hosted runner, so this
    # job stays GitHub-hosted. Dropping --provenance would publish the same
    # bytes with no verifiable link back to the commit that built them.
    timeout-minutes: 7200
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Build package
        run: npm run build

      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Publish package
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
