name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Create Release
    types:
      - completed

jobs:
  publish-npm:
    # npm refuses a provenance attestation from a self-hosted runner, so this
    # job stays GitHub-hosted. Dropping --provenance would publish the same
    # bytes with no verifiable link back to the commit that built them.
    timeout-minutes: 7200
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn build

      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Publish package
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
