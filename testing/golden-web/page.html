<meta charset="utf-8">
<style>body{margin:0;background:#000}#stage{position:relative;width:1280px;height:720px}video{width:1280px;height:720px}</style>
<div id="stage"><video id="v" src="/clip.mp4" muted playsinline></video></div>
<script type="module">
	// Plays the generated clip, loads the fixture through the kit under test and
	// captures the overlay canvas per presented frame. run.mjs drives it over CDP.
	import { NMSubtitleOctopus } from '/kit/nomercy-subtitle-octopus.js';

	const W = 1280;
	const H = 720;
	const video = document.getElementById('v');
	const scratch = document.createElement('canvas');
	scratch.width = W;
	scratch.height = H;
	const cx = scratch.getContext('2d', { willReadFrequently: true });
	const wait = ms => new Promise(r => setTimeout(r, ms));

	function nextFrame() {
		return new Promise(res => video.requestVideoFrameCallback((now, md) => res({ now, mt: md.mediaTime })));
	}

	// Light mode only snapshots the overlay in the frame callback; pixels are read afterwards.
	function grab(scenario, frame) {
		const overlay = document.querySelector('.nomercy-libass canvas');
		const rec = { scenario, now: frame.now, mt: frame.mt, edt: frame.edt, cbAt: frame.cbAt, sends: window.__nmTimes.length, crop: null, rgb: null };
		if (window.__light)
			rec.bmp = createImageBitmap(overlay);
		else
			extract(rec, overlay);
		window.__cap.push(rec);
	}

	function extract(rec, overlay) {
		cx.fillStyle = '#000';
		cx.fillRect(0, 0, W, H);
		cx.drawImage(overlay, 0, 0, W, H);
		const d = cx.getImageData(0, 0, W, H).data;
		let x0 = W; let y0 = H; let x1 = -1; let y1 = -1;
		for (let y = 0; y < H; y++) {
			for (let x = 0; x < W; x++) {
				const i = (y * W + x) * 4;
				if (d[i] | d[i + 1] | d[i + 2]) {
					if (x < x0) x0 = x;
					if (x > x1) x1 = x;
					if (y < y0) y0 = y;
					if (y > y1) y1 = y;
				}
			}
		}
		if (x1 >= 0) {
			const w = x1 - x0 + 1;
			const h = y1 - y0 + 1;
			const out = new Uint8Array(w * h * 3);
			let k = 0;
			for (let y = y0; y <= y1; y++) {
				for (let x = x0; x < x0 + w; x++) {
					const i = (y * W + x) * 4;
					out[k++] = d[i]; out[k++] = d[i + 1]; out[k++] = d[i + 2];
				}
			}
			rec.crop = [x0, y0, w, h];
			rec.rgb = out;
		}
	}

	// Captures every presented frame between two media times while playing.
	async function playRange(scenario, from, to) {
		video.currentTime = from;
		await nextFrame();
		await wait(400);
		await video.play();
		await new Promise((res) => {
			const cb = (now, md) => {
				grab(scenario, { now, mt: md.mediaTime, edt: md.expectedDisplayTime, cbAt: performance.now() });
				if (md.mediaTime < to)
					video.requestVideoFrameCallback(cb);
				else
					res();
			};
			video.requestVideoFrameCallback(cb);
		});
		video.pause();
	}

	window.golden = {
		async finalize() {
			for (const rec of window.__cap) {
				if (!rec.bmp) continue;
				const bmp = await rec.bmp;
				extract(rec, bmp);
				bmp.close();
				delete rec.bmp;
			}
		},
		async start(fixtureFonts, light) {
			window.__light = Boolean(light);
			window.__cap = [];
			const o = new NMSubtitleOctopus({
				video,
				trackUrl: '/fixture.ass',
				workerUrl: '/kit/nomercy-libass-worker.js',
				fonts: fixtureFonts,
				geometrySource: document.getElementById('stage'),
			});
			await new Promise((res, rej) => {
				o.on('rendererReady', () => res());
				o.on('error', rej);
			});
			await wait(800);
			return 'ready';
		},
		// Window times in seconds; the clip frames are 1001/24000 s apart.
		async play(ws, we) {
			await playRange('play', ws - 0.5, we + 0.1);
		},
		async seek(times) {
			for (const t of times) {
				video.currentTime = t;
				const f = await nextFrame();
				await wait(500);
				grab('seek', f);
			}
		},
		async pauseResume(ws, we) {
			const mid = (ws + we) / 2;
			video.currentTime = ws - 0.3;
			await nextFrame();
			await wait(400);
			await video.play();
			let last = null;
			await new Promise((res) => {
				const cb = (now, md) => {
					last = { now, mt: md.mediaTime };
					if (md.mediaTime >= mid)
						res();
					else
						video.requestVideoFrameCallback(cb);
				};
				video.requestVideoFrameCallback(cb);
			});
			video.pause();
			await wait(500);
			grab('paused', last);
			await video.play();
			await new Promise((res) => {
				let n = 0;
				const cb = (now, md) => {
					grab('resumed', { now, mt: md.mediaTime });
					if (++n < 8)
						video.requestVideoFrameCallback(cb);
					else
						res();
				};
				video.requestVideoFrameCallback(cb);
			});
			video.pause();
		},
		meta() {
			return JSON.stringify({ frames: window.__cap.map(r => ({ scenario: r.scenario, now: r.now, mt: r.mt, edt: r.edt, cbAt: r.cbAt, sends: r.sends, crop: r.crop })), sent: window.__nmTimes, origin: performance.timeOrigin, inst: window.__nmInst, longTasks: window.__longTasks });
		},
		chunk(i, n) {
			const out = [];
			for (let k = i; k < Math.min(i + n, window.__cap.length); k++) {
				const r = window.__cap[k];
				if (!r.rgb) { out.push(null); continue; }
				let s = '';
				for (let p = 0; p < r.rgb.length; p += 30000)
					s += String.fromCharCode.apply(null, r.rgb.subarray(p, p + 30000));
				out.push(btoa(s));
			}
			return JSON.stringify(out);
		},
	};
	window.goldenReady = true;
</script>
